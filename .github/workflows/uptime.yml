name: TEAM uptime

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check team.mmtnexus.com
        id: probe
        shell: bash
        run: |
          set -u
          fail=""
          check() { # url, text that must appear
            for try in 1 2 3; do
              out=$(curl -sS -L --max-time 20 -o page.html -w "%{http_code} %{time_total}" "$1" 2>&1) || out="000 $out"
              code=${out%% *}
              if [ "$code" = "200" ] && grep -q "$2" page.html; then echo "OK   $1  ($out)"; return 0; fi
              echo "try $try: $1 -> $out"; sleep 20
            done
            fail="$fail\n- $1 → HTTP $code"
            return 1
          }
          check "https://team.mmtnexus.com/" "Sign in to TEAM" || true
          check "https://team.mmtnexus.com/register.php" "Create your TEAM workspace" || true
          if [ -n "$fail" ]; then printf "%b\n" "$fail" > failures.txt; echo "down=1" >> "$GITHUB_OUTPUT"; else echo "down=0" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the outage issue
        if: steps.probe.outputs.down == '1'
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          n=$(gh issue list --label outage --state open --json number -q '.[0].number')
          body="TEAM check failed at $(date -u '+%Y-%m-%d %H:%M UTC') (3 tries each):
          $(cat failures.txt)

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create outage --color B60205 --description "TEAM is down" 2>/dev/null || true
          if [ -z "$n" ]; then gh issue create --title "TEAM is down" --label outage --body "$body"; else gh issue comment "$n" --body "Still down. $body"; fi
          exit 1

      - name: Close the outage issue when back up
        if: steps.probe.outputs.down == '0'
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          n=$(gh issue list --label outage --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue close "$n" --comment "TEAM is back up at $(date -u '+%Y-%m-%d %H:%M UTC')."; fi
